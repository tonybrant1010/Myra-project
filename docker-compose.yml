services:
  # Szűkre szabott, csak "container stop"-ot engedő proxy a nyers docker.sock elé.
  # A backend konténer így nem kap közvetlen (gyakorlatilag root-ekvivalens) hozzáférést
  # a hoszt teljes Docker daemonjához - csak ezen a proxyn keresztül, csak stop hívást
  # tud indítani. Lásd: https://github.com/Tecnativa/docker-socket-proxy
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: myra-docker-socket-proxy
    restart: unless-stopped
    # FONTOS: itt szándékosan NINCS "privileged: true". A proxy célja épp a jogosultság
    # szűkítése; privileged módban viszont maga a proxy kapna root-ekvivalens hozzáférést
    # a hoszthoz, ami az egész konstrukció értelmét lerontaná. A read-only socket-mount elég.
    environment:
      # Minden más API szekció (EXEC, IMAGES, NETWORKS, VOLUMES, BUILD, AUTH,
      # SECRETS, SWARM stb.) alapértelmezetten (0) tiltva marad.
      - CONTAINERS=1
      - POST=1
      - ALLOW_STOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Szándékosan nincs "ports:" - csak a compose belső hálózatáról érhető el,
    # a hoszton/kívülről nem publikált.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myra-backend
    ports:
      # Csak a szerverről érhető el (teszteléshez). A külvilág felé csak a tunnel.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    # FONTOS: itt szándékosan NINCS "ports:" szekció. 2026-08-13 óta a backend
    # kizárólag a cloudflared konténeren (Cloudflare Tunnel) keresztül érhető el,
    # a VM-en nincs publikált port. A healthcheck a konténeren BELÜLRŐL hívja a
    # localhost:8001-et, azt ez nem érinti. Ha ide visszakerül a port, azzal
    # újranyitod a gépet az internet felé — ne tedd vissza.
    environment:
      - JWT_SECRET=${JWT_SECRET:?set in .env}
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env (Supabase/PostgreSQL)}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-require}
      - ADMIN_EMAIL_ALLOWLIST=${ADMIN_EMAIL_ALLOWLIST:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - MYRA_PROXY_SECRET=${MYRA_PROXY_SECRET:?set in .env}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - DOCKER_SOCKET_PROXY_URL=http://docker-socket-proxy:2375
      # A Geminihez küldött csomag mérete. Ezek a kód szerint eddig is állíthatók
      # voltak, de ide nem voltak felvéve, ezért SOHA nem jutottak el a konténerbe —
      # ugyanaz a hiba, mint korábban a TTS_ENGINE-nél. Mostantól a .env-ből
      # hangolhatók, újraépítés nélkül (elég egy `docker compose up -d backend`).
      #
      # RAG_CHAT_CHUNKS=0        -> egyáltalán nincs PDF-részlet a promptban
      #                             (a 2026-08-12 előtti állapot), és elmarad a
      #                             kérésenkénti 2-8 mp RAG-idő is
      # RAG_VECTOR_MAX_DISTANCE  -> ennél lazább találat nem megy át (1.0 = nincs szűrés)
      - CHAT_HISTORY_MAX_MESSAGES=${CHAT_HISTORY_MAX_MESSAGES:-120}
      - CHAT_HISTORY_MAX_CHARS=${CHAT_HISTORY_MAX_CHARS:-45000}
      - RAG_CHAT_CHUNKS=${RAG_CHAT_CHUNKS:-5}
      - RAG_VECTOR_MAX_DISTANCE=${RAG_VECTOR_MAX_DISTANCE:-0.62}
      - RAG_CANDIDATE_POOL=${RAG_CANDIDATE_POOL:-20}
      - RAG_KEEPWARM_INTERVAL_S=${RAG_KEEPWARM_INTERVAL_S:-240}
      # A beágyazó modell 128 tokennél (~500 karakter) elvág. Ennél nagyobb darab
      # vége nem kerül a vektorba. Változtatás után ÚJRAINDEXELÉS kell!
      - RAG_CHUNK_MAX_CHARS=${RAG_CHUNK_MAX_CHARS:-400}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-80}
      # Felolvasás. Korábban ez a három sor hiányzott, ezért a TTS_ENGINE sosem
      # jutott el a konténerbe: alapértelmezésben "none" maradt, és a /tts/speak
      # végpont élesben 503-at adott. Értéke "gemini", "piper" vagy "none".
      - TTS_ENGINE=${TTS_ENGINE:-none}
      # A hangnév szándékosan azonos a Myra Live-ban használttal.
      - GEMINI_TTS_VOICE=${GEMINI_TTS_VOICE:-Kore}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
    volumes:
      - ./backend/data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/config').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # FONTOS: a server.py lifespan-jében a RAG warmup a `yield` ELŐTT fut
      # (server.py: `await _warmup_rag_runtime()`), ezért az uvicorn kb. 7 percig
      # egyáltalán nem fogad kapcsolatot. start_period nélkül a Docker 3 sikertelen
      # próba után — vagyis már ~90 másodperccel az indulás után — "unhealthy"-re
      # állítja a konténert, teljesen egészséges build esetén is. A start_period
      # alatt a sikertelen próbák nem számítanak bele a retries-be, az állapot
      # "starting" marad, és az első sikeres próbánál azonnal "healthy" lesz.
      #
      # Az érték MÉRÉS alapján 900s, nem becslés: a 2026-08-16-i deploynál a
      # warmup 596.6 másodpercig tartott (a korábbi mérés még 439s volt), tehát
      # egy 600s-os kerettől mindössze 3 másodperc választotta el. A warmup ideje
      # a VM memórianyomásától függ (969 MB RAM, jelentős swap), ezért ingadozik —
      # a keretnek a lassú esetet kell elbírnia, nem az átlagot.
      start_period: 900s

  # Cloudflare Tunnel: kifelé épített kapcsolat, nincs bejövő port a VM-en.
  # A publikus hosztnév (api.myra-project.hu) és az útvonalszűrő (^/api/.*$) NEM itt,
  # hanem a Cloudflare Zero Trust felületén, a tunnel konfigurációjában van tárolva —
  # ez a konténer csak lehúzza magának induláskor.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: myra-cloudflared
    # Elso inditas kifejezett keresre: docker compose --profile tunnel up -d cloudflared
    # Utana a gep ujrainditasakor magatol visszaall (unless-stopped). Ha kezzel allitod le
    # (docker stop), leallva marad. A karanten nem ezt allitja le, hanem a backend
    # karbantartasi modjat kapcsolja be, ezert ez nem gyengiti a vedelmet.
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set in .env}
    depends_on:
      - backend
    # Szándékosan nincs "ports:" - kifelé kapcsolódik, befelé nem fogad.

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1460
