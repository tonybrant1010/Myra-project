; llama-server router mod - a Myra helyi modelljei (myrallm, <llm-ip>)
; A szekcio neve a modell azonositoja: ezt latja es valasztja a Myra admin.
; Kulcsok: a parancssori kapcsolok hosszu neve, kotojelek nelkul.
;
; 2026-10-15: ket modell.
;
; A PULI-LlumiX-Llama-3.1 (NYTK magyar tovabbtanitas, Llama-3.1-8B alap) azert
; kerult a Llama-2 alapu valtozat helyere, mert a Llama-3.1-nek GQA-ja van
; (8 KV-head a 32 helyett), ezert a KV cache negyede: 128 KiB/token f16-tal.
; A Llama-2-nek 512 KiB/token, ami a Myra 15-19 ezer tokenes kereshez 8-10 GiB
; KV-ot jelentett - az nem fer be a 8 GB-os kartyara. Kvantalt KV-val (q4_0)
; ugyan befert, de a Vulkanon az attention visszafejtese miatt 91 token/s-ra
; esett a prompt-feldolgozas (a CPU 134 volt), es hosszu kontextuson a modell
; szotagkavalkadba torkollott.
;
; A qwen3.6-35b-a3b hibrid attentiont hasznal, ezert a KV-je toredeke, es a
; 19 ezres keres is elfer a 8 GB-on. Ez az elsodleges modell.
version = 1

[*]
; 18 szal (20-bol), a beolvasashoz (batch) is; 2 marad a rendszernek.
threads = 18
threads-batch = 18
parallel = 1
kv-unified = true
; A kesz prompt-allapotok RAM-gyorsitotara (MiB), modellenkent. Csak memoria, lemezre nem ir.
cache-ram = 32768
jinja = true
log-colors = off
min-p = 0
n-predict = 1024

; ---------------------------------------------------------------------------
; Qwen 3.6 35B-A3B - MoE, tokenenkent 3B aktiv parameter, hibrid attention
;
; A szakertoretegek CPU-n (n-cpu-moe), az attention a GPU-n. A hibrid attention
; miatt a KV cache kicsi, ezert a 24k kontextus is elfer a 8 GB-os kartyán.
; ---------------------------------------------------------------------------
[qwen3.6-35b-a3b]
model = /home/<user>/gguf/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
c = 24576
n-gpu-layers = 99
n-cpu-moe = 70
no-op-offload = true
ubatch-size = 256
reasoning = off
temp = 0.6
top-k = 20
top-p = 0.8
load-on-startup = true

; ---------------------------------------------------------------------------
; PULI-LlumiX-Llama-3.1 - NYTK magyar finetune
;
; A KV szandekosan f16 (nincs cache-type sor): gyors es helyes. A 20 480
; tokenes kontextus ~2,5 GiB KV-ot jelent, ami a 4,58 GiB suly melle elfer.
; ---------------------------------------------------------------------------
[puli-llumix-8b]
model = /home/<user>/gguf/PULI-LlumiX-Llama-3.1.Q4_K_M.gguf
c = 20480
ubatch-size = 512
n-predict = 512
n-gpu-layers = 99
flash-attn = on
temp = 0.6
top-p = 0.9
