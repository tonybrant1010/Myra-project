; llama-server router mod - a Myra helyi modelljei (myrallm, 192.168.1.184)
; A szekcio neve a modell azonositoja: ezt latja es valasztja a Myra admin.
; Kulcsok: a parancssori kapcsolok hosszu neve, kotojelek nelkul.
version = 1

[*]
; 18 szal (20-bol), a beolvasashoz (batch) is; 2 marad a rendszernek.
threads = 18
threads-batch = 18
c = 32768
parallel = 1
kv-unified = true
; A kesz prompt-allapotok RAM-gyorsitotara (MiB), modellenkent. Csak memoria, lemezre nem ir.
cache-ram = 8192
swa-full = true
jinja = true
n-predict = 400
; Nincs elore betoltes: egyszerre legfeljebb 3 modell van a memoriaban (--models-max 3),
; a ritkabban hasznalt kiesik, es valasztaskor ujra betoltodik.

; Google Gemma 4 E4B (kb. 4B effektiv), Unsloth GGUF
[gemma4-e4b]
model = /home/antalodor/gguf/gemma-4-E4B-it-UD-Q4_K_XL.gguf
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking":false}

; EuroLLM 9B Instruct 2512 (EU projekt, europai nyelvek, magyar is), 32k kontextus
[eurollm-9b]
model = /home/antalodor/gguf/EuroLLM-9B-Instruct-2512.Q4_K_M.gguf

; Qwen 3.5 9B, Unsloth GGUF, gondolkodas kikapcsolva
[qwen3.5-9b]
model = /home/antalodor/gguf/Qwen3.5-9B-UD-Q4_K_XL.gguf
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking":false}
; Mintavetelezes: alacsonyabb homerseklet, szukebb jeloltkor -> kevesebb kitalalt,
; magyartalan szoalak (a llama-server alapja: temp 0.8, top-k 40, top-p 0.95).
temp = 0.6
top-k = 20
top-p = 0.8
min-p = 0

; Qwen 2.5 7B Instruct (regebbi), a Qwen sajat GGUF-ja (ket reszben)
[qwen2.5-7b]
model = /home/antalodor/gguf/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf

; PULI LlumiX (NYTK, Llama 3.1 8B Instruct magyar tovabbtanitasa), max 16k kontextus
[puli-llumix-8b]
model = /home/antalodor/gguf/PULI-LlumiX-Llama-3.1.Q4_K_M.gguf
c = 16384

; --- Uncensored (abliterated, huihui-ai) valtozatok: csak teszteleshez ---
; A biztonsagi elutasitasok ki vannak veve belolük; elo felhasznaloknal nem ajanlott.
[gemma4-e4b-uncensored]
model = /home/antalodor/gguf/Huihui-gemma-4-E4B-it-abliterated.Q4_K_M.gguf
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking":false}

[qwen3.5-9b-uncensored]
model = /home/antalodor/gguf/Huihui-Qwen3.5-9B-abliterated.Q4_K_M.gguf
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking":false}
